<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok authorization</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}a{color:#2a6}code,#code{font-family:ui-monospace,Menlo,monospace}#code{display:block;word-break:break-all;background:#f4f4f4;border:1px solid #ddd;border-radius:6px;padding:12px;font-size:15px;margin:12px 0}button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #2a6;background:#2a6;color:#fff;cursor:pointer}.err{color:#b00}small{color:#666}</style></head><body>
<h1>TikTok authorization</h1>
<p id="msg">Reading the authorization code…</p>
<div id="code" hidden></div>
<p><button id="copy" hidden>Copy code</button></p>
<p id="state"></p>
<p><small>This page runs entirely in your browser. The code is never sent anywhere &mdash; copy it into the terminal. It expires in a few minutes, so finish the exchange now.</small></p>
<p><a href="index.html">Home</a> &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a></p>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var msg = document.getElementById('msg'), box = document.getElementById('code');
  var btn = document.getElementById('copy'), st = document.getElementById('state');
  if (q.get('error')) {
    msg.className = 'err';
    msg.textContent = 'TikTok refused: ' + q.get('error') + ' — ' + (q.get('error_description') || '');
    return;
  }
  var code = q.get('code');
  if (!code) {
    msg.className = 'err';
    msg.textContent = 'No ?code= in this URL. Open this page only by completing the TikTok consent screen.';
    return;
  }
  msg.textContent = 'Copy this authorization code into the terminal:';
  box.textContent = code; box.hidden = false; btn.hidden = false;
  btn.onclick = function () {
    navigator.clipboard.writeText(code).then(function () { btn.textContent = 'Copied'; });
  };
  st.innerHTML = 'state: <code>' + (q.get('state') || '(none)') + '</code> — it must match the state the terminal printed.';
})();
</script>
</body></html>
